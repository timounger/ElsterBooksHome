name: Setup Python & Poetry
description: Set up Python, install the pinned Poetry version and the project dependencies via setup.bat.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.11.9"
  python-arch:
    description: Python architecture.
    required: false
    default: x64
  poetry-version:
    description: Poetry version to install (pinned).
    required: false
    default: "2.4.1"
  groups:
    description: 'Dependency groups passed to setup.bat (e.g. "source,test"). Empty installs all groups.'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        architecture: ${{ inputs.python-arch }}
    - name: Install Poetry
      shell: cmd
      run: python -m pip install poetry==${{ inputs.poetry-version }}
    - name: Install Packages
      shell: cmd
      run: setup.bat "${{ inputs.groups }}"
