---
# ------------------------------------------------------------------------------
# Delete old workflow runs via the GitHub CLI (no third-party action).
# Doc: https://cli.github.com/manual/gh_run_delete
# ------------------------------------------------------------------------------
name: Delete Workflows

# Only the actions scope is needed to list/delete workflow runs.
permissions:
  actions: write

# ------------------------------------------------------------------------------
# WORKFLOW TRIGGER
# ------------------------------------------------------------------------------
on:
  schedule:
    - cron: "0 3 1 * *"  # 03:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      retain_days:
        description: "Delete runs older than this many days."
        required: true
        default: "30"
      dry_run:
        description: "Only log what would be deleted, do not delete."
        type: boolean
        default: false

# ------------------------------------------------------------------------------
# WORKFLOW JOBS
# ------------------------------------------------------------------------------
jobs:
  delete-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          RETAIN_DAYS: ${{ github.event.inputs.retain_days || '30' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${RETAIN_DAYS} days" +%s)
          echo "Deleting completed runs older than ${RETAIN_DAYS} days (before $(date -u -d "@$cutoff")); dry_run=${DRY_RUN}"
          # Only completed runs can be deleted (in-progress runs return HTTP 403).
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json databaseId,createdAt,status \
            --jq ".[] | select(.status == \"completed\" and (.createdAt | fromdateiso8601) < $cutoff) | .databaseId")
          if [ -z "$ids" ]; then
            echo "No runs to delete."
            exit 0
          fi
          echo "$ids" | while read -r id; do
            [ -z "$id" ] && continue
            if [ "$id" = "${{ github.run_id }}" ]; then
              echo "Skip current run $id"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would delete run $id"
            elif gh run delete --repo "$GITHUB_REPOSITORY" "$id"; then
              echo "Deleted run $id"
            else
              echo "Could not delete run $id (skipped)"
            fi
          done
