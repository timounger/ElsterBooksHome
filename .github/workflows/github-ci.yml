---
# ------------------------------------------------------------------------------
# Central ElsterBooks GitHub CI
# Doc: https://docs.github.com/de/actions
# ------------------------------------------------------------------------------
name: ElsterBooks CI

# ------------------------------------------------------------------------------
# Token Permission
# Doc: https://docs.github.com/de/actions/reference/workflow-syntax-for-github-actions#permissions
# ------------------------------------------------------------------------------
permissions:
  actions: write
  artifact-metadata: none
  attestations: none
  checks: none
  contents: write
  deployments: none
  discussions: none
  id-token: none  # only write|none
  issues: none
  models: none  # only read|none
  packages: none
  pages: write
  pull-requests: write
  repository-projects: none
  security-events: none
  statuses: none
  vulnerability-alerts: none  # only read|none

defaults:
  run:
    shell: cmd

env:
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  MKDOCSTRINGS_OUTPUT_NAME: public
  MKDOCSTRINGS_OUTPUT_PATH: ./Documentation/public
  BINARY_EXE_NAME: bin_Exe
  BINARY_PATH: ./Executable/bin

# ------------------------------------------------------------------------------
# WORKFLOW TRIGGER
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - test_version
    paths:
      - "pyproject.toml"
  workflow_dispatch:  # Allows you to run this workflow manually from the Actions tab
    inputs:
      create_release:
        description: "Create Release. All jobs are executed."
        type: boolean
        default: false

# ------------------------------------------------------------------------------
# WORKFLOW JOBS
# ------------------------------------------------------------------------------
jobs:
  check-version:
    # Gate: on push, continue only if the version in pyproject.toml actually changed.
    # Always runs (never skipped) so dependent jobs are not auto-skipped on workflow_dispatch.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Compare version field with previous commit
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=$(git show HEAD~1:pyproject.toml | grep -m1 '^version' | cut -d'"' -f2 || echo "")
          curr=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "previous=$prev current=$curr"
          if [ "$prev" != "$curr" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
  # ------------------------------------------------------------------------------
  doc-MkDocStrings:
    needs: check-version
    if: (github.event_name == 'push' && needs.check-version.outputs.changed == 'true')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Python & Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          groups: source,docs
      - name: Run MkDocStrings
        working-directory: ./Documentation
        run: run_mkdoc_build.bat
      - name: Upload MkDocStrings Output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MKDOCSTRINGS_OUTPUT_NAME }}
          path: ${{ env.MKDOCSTRINGS_OUTPUT_PATH }}
  # ------------------------------------------------------------------------------
  doc-Pages:
    needs: doc-MkDocStrings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Download MkDocStrings Output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MKDOCSTRINGS_OUTPUT_NAME }}
          path: ${{ env.MKDOCSTRINGS_OUTPUT_PATH }}
      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ${{ env.MKDOCSTRINGS_OUTPUT_PATH }}
  # ------------------------------------------------------------------------------
  build-Exe:
    needs: check-version
    if: (github.event_name == 'push' && needs.check-version.outputs.changed == 'true')
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Python & Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          groups: source,exec
      - name: Build Executable
        working-directory: ./Executable
        run: generate_executable.bat
      - name: Upload Executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_EXE_NAME }}
          path: ${{ env.BINARY_PATH }}
  # ------------------------------------------------------------------------------
  create-Release:
    if: inputs.create_release || (github.event_name == 'push')
    needs: build-Exe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Download Executable
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BINARY_EXE_NAME }}
          path: ${{ env.BINARY_PATH }}
      - name: Get Commit Message
        shell: bash
        run: echo "commit_message=$(git log -1 --pretty=format:"%s")" >> $GITHUB_ENV
      - name: Get version and prerelease status from pyproject.toml
        shell: bash
        run: |
          raw=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          IFS='.' read -r major minor patch build <<< "$raw"
          build=${build:-0}
          if [ "$build" = "0" ]; then
            echo "file_version=${major}.${minor}.${patch}" >> "$GITHUB_ENV"
          else
            echo "file_version=${major}.${minor}.${patch}.${build}" >> "$GITHUB_ENV"
          fi
      - name: Create tag
        shell: bash
        run: |
          tag_name="v${{ env.file_version }}"
          git tag "$tag_name"
          git push origin "$tag_name"
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.file_version }}
          name: "[ElsterBooks] v${{ env.file_version }}"
          body: "Git SHA: ${{ github.sha }}\n\n${{ env.commit_message }}"
          draft: false
          prerelease: false
          files: ${{ env.BINARY_PATH }}/*
          token: ${{ github.token }}
